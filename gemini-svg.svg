<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo gris muy oscuro con bordes redondeados para que resalte siempre -->
  <rect width="100" height="100" rx="20" fill="#1E1E1E"/>
  
  <!-- Letra Y (Estilo geométrico con acento de color azul tecnológico) -->
  <polyline points="20,25 35,45 35,70" stroke="#4FC3F7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="50" y1="25" x2="35" y2="45" stroke="#4FC3F7" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Letra C (1) -->
  <polyline points="68,25 55,25 55,70 68,70" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Letra C (2) -->
  <polyline points="88,25 75,25 75,70 88,70" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Línea inferior (Guiño sutil a una serie de tiempo o nodos de datos) -->
  <circle cx="20" cy="85" r="3" fill="#4FC3F7"/>
  <line x1="28" y1="85" x2="82" y2="85" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8, 6"/>
  <circle cx="90" cy="85" r="3" fill="#FFFFFF"/>
</svg>
